---
# Dépôt apt officiel Sublime Text (sublimetext.com/docs/linux_repositories.html).
# Format inhabituel : la suite est un chemin complet ("apt/stable/") sans
# composants séparés (vérifié : dépôt "plat", pas de sous-dossier dists/).

- name: Ajouter le dépôt apt officiel Sublime Text (format deb822)
  ansible.builtin.deb822_repository:
    name: sublime-text
    types: deb
    uris: https://download.sublimetext.com/
    suites: apt/stable/
    # Cible amd64 uniquement, comme le reste du projet (ISO autoinstall
    # amd64 exclusivement).
    architectures: amd64
    signed_by: https://download.sublimetext.com/sublimehq-pub.gpg
    install_python_debian: true

- name: Mettre à jour le cache apt après ajout du dépôt Sublime Text
  ansible.builtin.apt:
    update_cache: true

- name: Installer Sublime Text
  ansible.builtin.apt:
    name: sublime-text
    state: present
